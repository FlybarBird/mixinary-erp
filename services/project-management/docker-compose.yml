# Mixinary Project Management — isolated Plane CE stack
# Project name: mixinary-pm (never share network/volumes with ERP)
name: mixinary-pm

x-db-env: &db-env
  PGHOST: ${PGHOST:-mixinary-pm-db}
  PGDATABASE: ${PGDATABASE:-mixinary_pm}
  POSTGRES_USER: ${POSTGRES_USER:-mixinary_pm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-mixinary_pm}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-mixinary-pm-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://mixinary-pm-redis:6379/0}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-mixinary_pm_minio}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-mixinary_pm_minio}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://mixinary-pm-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-mixinary-pm-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-8088}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-8443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-mixinary-pm-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}
  # Company base path (Cloudflare strips or forwards /project-management)
  APP_BASE_PATH: ${APP_BASE_PATH:-/project-management}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-mixinary-pm-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mixinary_pm}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-mixinary_pm}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-mixinary_pm}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://mixinary-pm-api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?set LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-https://localhost/project-management}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://mixinary_pm:${POSTGRES_PASSWORD}@mixinary-pm-db/mixinary_pm}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  AMQP_URL: ${AMQP_URL:-amqp://mixinary_pm:${RABBITMQ_PASSWORD}@mixinary-pm-mq:5672/mixinary_pm}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?set LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  APP_BASE_PATH: ${APP_BASE_PATH:-/project-management}
  # Authentik OIDC
  OPENID_CONNECT_ENABLED: ${OPENID_CONNECT_ENABLED:-1}
  OPENID_CONNECT_CLIENT_ID: ${OPENID_CONNECT_CLIENT_ID:-mixinary-pm}
  OPENID_CONNECT_CLIENT_SECRET: ${OPENID_CONNECT_CLIENT_SECRET:-}
  OPENID_CONNECT_ISSUER: ${OPENID_CONNECT_ISSUER:-}
  OPENID_CONNECT_CALLBACK_URL: ${OPENID_CONNECT_CALLBACK_URL:-https://localhost/project-management/auth/oidc/callback}

networks:
  mixinary_pm_net:
    name: mixinary_pm_net
    driver: bridge

services:
  mixinary-pm-web:
    image: ${MIXINARY_PM_FRONTEND_IMAGE:-makeplane/plane-frontend:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-web
    networks: [mixinary_pm_net]
    restart: unless-stopped
    depends_on: [mixinary-pm-api, mixinary-pm-worker]
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-/project-management}

  mixinary-pm-space:
    image: ${MIXINARY_PM_SPACE_IMAGE:-makeplane/plane-space:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-space
    networks: [mixinary_pm_net]
    restart: unless-stopped
    depends_on: [mixinary-pm-api, mixinary-pm-web]

  mixinary-pm-admin:
    image: ${MIXINARY_PM_ADMIN_IMAGE:-makeplane/plane-admin:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-admin
    networks: [mixinary_pm_net]
    restart: unless-stopped
    depends_on: [mixinary-pm-api, mixinary-pm-web]

  mixinary-pm-live:
    image: ${MIXINARY_PM_LIVE_IMAGE:-makeplane/plane-live:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-live
    networks: [mixinary_pm_net]
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [mixinary-pm-api, mixinary-pm-web]

  mixinary-pm-api:
    image: ${MIXINARY_PM_BACKEND_IMAGE:-makeplane/plane-backend:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-api
    networks: [mixinary_pm_net]
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - mixinary_pm_logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [mixinary-pm-db, mixinary-pm-redis, mixinary-pm-mq]

  mixinary-pm-worker:
    image: ${MIXINARY_PM_BACKEND_IMAGE:-makeplane/plane-backend:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-worker
    networks: [mixinary_pm_net]
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - mixinary_pm_logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [mixinary-pm-api, mixinary-pm-db, mixinary-pm-redis, mixinary-pm-mq]

  mixinary-pm-beat:
    image: ${MIXINARY_PM_BACKEND_IMAGE:-makeplane/plane-backend:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-beat
    networks: [mixinary_pm_net]
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - mixinary_pm_logs_beat:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [mixinary-pm-api, mixinary-pm-db, mixinary-pm-redis, mixinary-pm-mq]

  mixinary-pm-migrator:
    image: ${MIXINARY_PM_BACKEND_IMAGE:-makeplane/plane-backend:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-migrator
    networks: [mixinary_pm_net]
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - mixinary_pm_logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [mixinary-pm-db, mixinary-pm-redis]

  mixinary-pm-db:
    image: postgres:15.7-alpine
    container_name: mixinary-pm-db
    networks: [mixinary_pm_net]
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - mixinary_pm_pgdata:/var/lib/postgresql/data

  mixinary-pm-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: mixinary-pm-redis
    networks: [mixinary_pm_net]
    restart: unless-stopped
    volumes:
      - mixinary_pm_redisdata:/data

  mixinary-pm-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: mixinary-pm-mq
    networks: [mixinary_pm_net]
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - mixinary_pm_rabbitmq:/var/lib/rabbitmq

  mixinary-pm-minio:
    image: minio/minio:latest
    container_name: mixinary-pm-minio
    networks: [mixinary_pm_net]
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - mixinary_pm_uploads:/export

  mixinary-pm-proxy:
    image: ${MIXINARY_PM_PROXY_IMAGE:-makeplane/plane-proxy:${APP_RELEASE:-v1.3.1}}
    container_name: mixinary-pm-proxy
    networks: [mixinary_pm_net]
    restart: unless-stopped
    environment:
      <<: *proxy-env
    ports:
      # Internal publish for Cloudflare Tunnel / host proxy (not shared with ERP)
      - "${LISTEN_HTTP_PORT:-8088}:80"
      - "${LISTEN_HTTPS_PORT:-8443}:443"
    volumes:
      - mixinary_pm_proxy_config:/config
      - mixinary_pm_proxy_data:/data
    depends_on:
      - mixinary-pm-web
      - mixinary-pm-api
      - mixinary-pm-space
      - mixinary-pm-admin
      - mixinary-pm-live

volumes:
  mixinary_pm_pgdata:
  mixinary_pm_redisdata:
  mixinary_pm_uploads:
  mixinary_pm_logs_api:
  mixinary_pm_logs_worker:
  mixinary_pm_logs_beat:
  mixinary_pm_logs_migrator:
  mixinary_pm_rabbitmq:
  mixinary_pm_proxy_config:
  mixinary_pm_proxy_data:
