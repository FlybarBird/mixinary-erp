# Mixinary Project Management — isolated OpenProject stack
# Upstream: openproject/openproject (Community). Pin major via OPENPROJECT_VERSION.
# Do not share networks/volumes/secrets with ERP.
name: mixinary-pm

networks:
  mixinary_pm_net:
    name: mixinary_pm_net
    driver: bridge

volumes:
  mixinary_op_pgdata:
  mixinary_op_assets:

services:
  openproject-db:
    image: postgres:16-alpine
    container_name: mixinary-pm-db
    networks: [mixinary_pm_net]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPENPROJECT_DB_USER:-openproject}
      POSTGRES_PASSWORD: ${OPENPROJECT_DB_PASSWORD:?set OPENPROJECT_DB_PASSWORD}
      POSTGRES_DB: ${OPENPROJECT_DB_NAME:-openproject}
    volumes:
      - mixinary_op_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENPROJECT_DB_USER:-openproject} -d ${OPENPROJECT_DB_NAME:-openproject}"]
      interval: 10s
      timeout: 5s
      retries: 10

  openproject-cache:
    image: memcached:1.6-alpine
    container_name: mixinary-pm-cache
    networks: [mixinary_pm_net]
    restart: unless-stopped

  openproject:
    image: openproject/openproject:${OPENPROJECT_VERSION:-17}
    container_name: mixinary-pm-web
    networks: [mixinary_pm_net]
    restart: unless-stopped
    depends_on:
      openproject-db:
        condition: service_healthy
      openproject-cache:
        condition: service_started
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${LISTEN_HTTP_PORT:-8087}:80"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST__NAME:-localhost:8087}
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-false}
      OPENPROJECT_DEFAULT__LANGUAGE: ${OPENPROJECT_DEFAULT__LANGUAGE:-en}
      # Suite path — must match Cloudflare + NEXT_PUBLIC_PM_BASE_PATH
      OPENPROJECT_RAILS__RELATIVE__URL__ROOT: ${APP_BASE_PATH:-/project-management}
      DATABASE_URL: postgres://${OPENPROJECT_DB_USER:-openproject}:${OPENPROJECT_DB_PASSWORD}@openproject-db:5432/${OPENPROJECT_DB_NAME:-openproject}
      # Official cache wiring (not MEMCACHE_SERVER alone)
      OPENPROJECT_RAILS__CACHE__STORE: memcache
      OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache:11211
      # --- Community login (password) — OIDC is Enterprise-only ---
      # Keep password login enabled so Community installs can always sign in.
      OPENPROJECT_DISABLE__PASSWORD__LOGIN: ${OPENPROJECT_DISABLE__PASSWORD__LOGIN:-false}
      OPENPROJECT_LOGIN__REQUIRED: ${OPENPROJECT_LOGIN__REQUIRED:-true}
      OPENPROJECT_LOST__PASSWORD: ${OPENPROJECT_LOST__PASSWORD:-true}
      # Seeded on first boot only (changing later has no effect).
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD: ${OPENPROJECT_SEED__ADMIN__USER__PASSWORD:-admin}
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: ${OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET:-true}
      OPENPROJECT_SEED__ADMIN__USER__MAIL: ${OPENPROJECT_SEED__ADMIN__USER__MAIL:-admin@example.net}
      OPENPROJECT_SEED__ADMIN__USER__NAME: ${OPENPROJECT_SEED__ADMIN__USER__NAME:-OpenProject Admin}
      OPENPROJECT_SEED__ADMIN__USER__LOCKED: ${OPENPROJECT_SEED__ADMIN__USER__LOCKED:-false}
      # Optional Enterprise OIDC (ignored / unavailable on Community without EE token)
      OPENPROJECT_OPENID__CONNECT__AUTHENTIK__DISPLAY__NAME: ${OIDC_DISPLAY_NAME:-Authentik}
      OPENPROJECT_OPENID__CONNECT__AUTHENTIK__HOST: ${OIDC_ISSUER:-}
      OPENPROJECT_OPENID__CONNECT__AUTHENTIK__IDENTIFIER: ${OIDC_CLIENT_ID:-}
      OPENPROJECT_OPENID__CONNECT__AUTHENTIK__SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - mixinary_op_assets:/var/openproject/assets
    healthcheck:
      # Relative URL root — login must be under /project-management
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/project-management/login | grep -E '^(200|302)$$'",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
